<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- The strips the phone draws its own furniture on take the app's own ground,
     so the screen is the app from end to end rather than a page inside a
     browser. The two values are the light and dark ground in theme.css. -->
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171d1c" media="(prefers-color-scheme: dark)">
<title>Family Diagram</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Diagram">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Libre+Franklin:wght@400;500;600;800&display=swap" media="print" onload="this.media='all'">
<!-- The only style the page has before the bundle arrives: the splash, and the
     app held out of sight until main.ts has drawn its first screen. The
     colours are the grounds and ink in theme.css. -->
<style>
#splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f7f6f2; transition: opacity 0.2s; }
#splash img { width: 72px; height: 72px; border-radius: 16px; animation: splash-breath 1.6s ease-in-out infinite alternate; }
#splash.gone { opacity: 0; pointer-events: none; }
#splash:not(.gone) ~ .app { visibility: hidden; }
@keyframes splash-breath { to { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #splash { background: #171d1c; } }
:root[data-theme="dark"] #splash { background: #171d1c; }
</style>
</head>
<body>
<div id="splash">
  <img src="/app/static/web/icon-192.png" alt="">
</div>
<div class="app">
  <div class="titlerow">
    <button class="backbtn" id="settings-back" type="button" aria-label="back" hidden></button>
    <button class="backbtn" id="coding-back" type="button" aria-label="back" hidden></button>
    <div class="ttl" id="title">Your family</div>
    <button class="iconbtn" id="coding-info" type="button" aria-label="Coding guidelines" hidden>
      <svg viewBox="0 0 22 22" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="1.5"></circle><circle cx="11" cy="6.6" r="1.15" fill="currentColor"></circle><rect x="10.1" y="9.4" width="1.8" height="7" rx="0.9" fill="currentColor"></rect></svg>
    </button>
    <button class="donebtn" id="coding-done" type="button" hidden>Done</button>
    <button class="iconbtn" id="case-open" type="button" aria-label="Case report" hidden>
      <svg viewBox="0 0 22 22" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="2.5" width="13" height="17" rx="1.5"/><path d="M8 7h6M8 10.5h6M8 14h3.5"/></svg>
    </button>
    <button class="avatar homescreen" id="homescreen" type="button" aria-label="Put Family Diagram on your home screen" hidden>
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="10" height="18" rx="2"/><path d="M9.5 17.5h3"/><path d="M11 6.5v6M8.8 10.3 11 12.5l2.2-2.2"/></svg>
    </button>
    <button class="avatar" id="account" type="button" aria-label="Account and settings"></button>
  </div>

  <div class="viewing" id="viewing" hidden>
    <span id="viewing-who"></span>
    <span class="viewing-acts">
      <button type="button" id="viewing-cut" hidden>Select a cut</button>
      <button type="button" id="viewing-back">Back to my diagram</button>
    </span>
  </div>
  <div class="cut-strip" id="cut-strip" hidden>
    <span id="cut-say"></span>
    <button type="button" class="cs-cancel">cancel</button>
  </div>

  <div class="split" id="chat-split">
  <div class="screen" id="chat-screen">
    <div class="pic">
      <div class="pin-label">
        <nav class="path" id="path" aria-label="where you are on the timeline"><span class="here">Timeline</span></nav>
        <button class="pl-btn" id="info" type="button" aria-label="about this cluster" hidden>
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="6.4" r="1.1" fill="currentColor"/><path d="M10 9v5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="view" id="view"></div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="chat" id="chat"></div>
    <label class="speakrow" id="speakrow">
      <input type="checkbox" id="speak">
      <span>speak replies</span>
    </label>
    <div class="inbar" id="inbar">
      <button class="fs-glyph" id="sessions-open" type="button" aria-label="sessions">
        <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 1h14M1 6h14M1 11h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="field"><div id="composer" contenteditable="true" role="textbox"
           aria-label="Message your coach" data-ph="Message your coach"></div></div>
      <button class="send" id="send" type="button" aria-label="Send"><span>&#8593;</span></button>
    </div>
    <div class="inbar ct-bar" id="cut-bar" hidden></div>
    <div id="pbp" hidden></div>
  </div>
  <aside class="pinned" id="chat-drawer" hidden></aside>
  </div>

  <div class="screen slideover" id="menu-screen" hidden>
    <div class="ovbar">
      <button class="backbtn" id="menu-close" type="button" aria-label="back"></button>
      <span class="ovt" id="menu-title"></span>
    </div>
    <div class="tabs" id="menu-tabs" role="tablist">
      <button class="tab on" id="tab-events" type="button" role="tab" aria-selected="true">Events</button>
      <button class="tab" id="tab-people" type="button" role="tab" aria-selected="false">People</button>
      <button class="tab" id="tab-questions" type="button" role="tab" aria-selected="false">Questions</button>
    </div>
    <div class="search" id="menu-searchrow">
      <input id="menu-search" type="text" placeholder="Search events" aria-label="Search events">
    </div>
    <div class="scroller" id="menu-body"></div>
  </div>

  <div class="screen" id="task-screen" hidden>
    <div class="fs-body" id="task-body"></div>
  </div>

  <div class="screen" id="ballot-screen" hidden>
    <div class="pic">
      <div class="pin-label"><span>Every event in this cut</span></div>
      <div class="view" id="ballot-view"></div>
      <div class="caption" id="ballot-caption"></div>
    </div>
    <div class="fs-body" id="ballot-body"></div>
  </div>

  <div class="screen" id="meeting-screen" hidden>
    <div class="mscroll">
      <div class="stats mhead" id="meeting-stats"></div>
      <div class="mstick">
        <div class="pic">
          <div class="view" id="meeting-view"></div>
        </div>
        <div class="mband">
          <div class="mkey" id="meeting-key"></div>
          <div class="sortbar" id="meeting-sort"></div>
        </div>
      </div>
      <div class="fs-body" id="meeting-body"></div>
    </div>
    <div class="ratbar" id="meeting-bar"></div>
  </div>

  <div class="screen" id="result-screen" hidden>
    <div class="mscroll">
      <div class="stats rhead" id="result-stats"></div>
      <div class="fs-body" id="result-body"></div>
    </div>
  </div>

  <div class="screen" id="agenda-screen" hidden>
    <div class="fs-body" id="agenda-body" tabindex="-1"></div>
  </div>

  <div class="screen" id="meet-screen" hidden>
    <div class="fs-body" id="meet-body"></div>
  </div>


  <div class="screen report" id="case-screen" hidden>
    <div class="ovbar">
      <button class="backbtn" id="case-close" type="button" aria-label="back"></button>
      <span class="ovt"><span id="case-title">Case report</span><span class="by" id="case-by"></span></span>
      <button class="iconbtn" id="case-family" type="button" aria-label="Who is in the family"></button>
    </div>
    <div class="pic">
      <div class="pin-label">
        <nav class="path" id="case-path" aria-label="where you are on the timeline"><span class="here">Timeline</span></nav>
        <button class="pl-btn" id="case-info" type="button" aria-label="about this cluster" hidden>
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="6.4" r="1.1" fill="currentColor"/><path d="M10 9v5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="view" id="case-view"></div>
      <div class="caption" id="case-caption"></div>
    </div>
    <nav class="rail" id="case-rail" aria-label="the cards"></nav>
    <div class="split">
      <aside class="pinned left" id="case-column" hidden><div class="scroller" id="case-dash"></div></aside>
      <div class="screen">
        <div class="chat" id="case-body"></div>
        <div id="case-pbp" hidden></div>
      </div>
    </div>
    <div class="screen slideover famout" id="case-famout" hidden>
      <div class="ovbar">
        <button class="backbtn" id="case-famout-close" type="button" aria-label="back to the case report"></button>
        <span class="ovt">Who is in the family</span>
      </div>
      <div class="scroller" id="case-famout-body"></div>
    </div>
  </div>

  <div class="split" id="coding-screen" hidden>
    <div class="screen">
      <div class="pic">
        <div class="pin-label"><span id="coding-crumb">Family timeline</span></div>
        <div class="view" id="coding-view"></div>
        <div class="caption" id="coding-caption"></div>
      </div>
      <div class="chat" id="coding-chat"></div>
      <div class="inbar" id="coding-inbar">
        <div class="field"><div id="coding-composer" contenteditable="true" role="textbox"
             aria-label="Say what this line tells you happened"
             data-ph="tap a line, then say what happened"></div></div>
        <button class="send" id="coding-send" type="button" aria-label="Send"><span>&#8593;</span></button>
      </div>
    </div>
    <aside class="pinned slideover" id="coding-drawer" hidden>
      <div class="ovbar">
        <button class="backbtn" id="coding-rows-close" type="button" aria-label="back"></button>
        <span class="ovt">Timeline</span>
      </div>
      <div class="tabs" id="coding-tabs" role="tablist">
        <button class="tab on" id="coding-tab-events" type="button" role="tab" aria-selected="true">Events</button>
        <button class="tab" id="coding-tab-people" type="button" role="tab" aria-selected="false">People</button>
      </div>
      <div class="search">
        <input id="coding-search" type="text" placeholder="Search events" aria-label="Search events">
      </div>
      <div class="scroller" id="coding-rows"></div>
    </aside>
  </div>

  <div class="screen" id="rules-screen" hidden>
    <div class="ovbar">
      <button class="backbtn" id="rules-close" type="button" aria-label="back"></button>
      <span class="ovt">Coding guidelines</span>
    </div>
    <div class="scroller" id="rules-body"></div>
  </div>

  <div class="signedout" id="signedout" hidden>
    <div class="so-app">Family Diagram</div>
    <div class="so-who" id="signedout-who"></div>
    <button class="so-in" id="signedout-in" type="button">Sign in</button>
  </div>

  <div class="overlay" id="overlay"></div>
</div>
<script type="module" src="/src/boot.ts"></script>
</body>
</html>
