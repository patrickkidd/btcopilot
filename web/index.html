<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Companion</title>
<link rel="manifest" href="/companion/manifest.webmanifest">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<div class="app">
  <div class="titlerow">
    <div class="ttl">Your family</div>
    <button class="iconbtn listbtn" id="menu-open" type="button" aria-label="open the timeline list">
      <svg width="20" height="16" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 1h14M1 6h14M1 11h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <div class="screen" id="chat-screen">
    <div class="pic">
      <div class="pin-label">
        <span>Family time line</span>
        <span id="pin-state"></span>
      </div>
      <div class="view" id="view"></div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="inbar" id="inbar">
      <button class="fs-glyph" id="sessions-open" type="button" aria-label="sessions">
        <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 1h14M1 6h14M1 11h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="field" id="composer" contenteditable="true" role="textbox"
           aria-label="Message your coach" data-ph="Message your coach"></div>
      <button class="send" id="send" type="button" aria-label="Send">&#8593;</button>
    </div>
  </div>

  <div class="screen" id="menu-screen" hidden>
    <div class="ovbar">
      <button class="backbtn" id="menu-close" type="button" aria-label="back">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M13.5 4.5 7 11l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <span class="ovt">Timeline</span>
    </div>
    <p class="banner">You can also edit just by chatting.</p>
    <div class="search">
      <input id="menu-search" type="text" placeholder="Search events" aria-label="Search events">
    </div>
    <div class="scroller" id="menu-body"></div>
    <div class="foot">
      <button class="addbtn" id="menu-add" type="button">+ Add event</button>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
