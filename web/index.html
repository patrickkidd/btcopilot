<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The strips the phone draws its own furniture on take the app's own ground,
     so the screen is the app from end to end rather than a page inside a
     browser. The two values are the light and dark ground in theme.css. -->
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171d1c" media="(prefers-color-scheme: dark)">
<title>Family Diagram</title>
<link rel="manifest" href="/personal/manifest.webmanifest">
<link rel="apple-touch-icon" href="/personal/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Diagram">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600;800&display=swap">
</head>
<body>
<div class="app">
  <div class="titlerow">
    <button class="sn-back" id="settings-back" type="button" aria-label="back" hidden>&#8249;</button>
    <button class="sn-back" id="coding-back" type="button" aria-label="back" hidden>&#8249;</button>
    <div class="ttl" id="title">Your family</div>
    <button class="iconbtn" id="coding-info" type="button" aria-label="Coding guidelines" hidden>
      <svg viewBox="0 0 22 22" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="1.5"></circle><circle cx="11" cy="6.6" r="1.15" fill="currentColor"></circle><rect x="10.1" y="9.4" width="1.8" height="7" rx="0.9" fill="currentColor"></rect></svg>
    </button>
    <button class="donebtn" id="coding-done" type="button" hidden>Done</button>
    <button class="avatar homescreen" id="homescreen" type="button" aria-label="Put Family Diagram on your home screen" hidden>
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="10" height="18" rx="2"/><path d="M9.5 17.5h3"/><path d="M11 6.5v6M8.8 10.3 11 12.5l2.2-2.2"/></svg>
    </button>
    <button class="avatar" id="account" type="button" aria-label="Account and settings"></button>
  </div>

  <div class="split" id="chat-split">
  <div class="screen" id="chat-screen">
    <div class="pic">
      <div class="pin-label">
        <button class="up" id="up" type="button" aria-label="back one level" hidden>&#8592;</button>
        <button class="up" id="clear" type="button" aria-label="put the event down" hidden>&#10005;</button>
        <span id="crumb">Family timeline</span>
        <button class="pl-btn" id="info" type="button" aria-label="about this cluster" hidden>
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="6.4" r="1.1" fill="currentColor"/><path d="M10 9v5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="view" id="view"></div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="chat" id="chat"></div>
    <label class="speakrow" id="speakrow">
      <input type="checkbox" id="speak">
      <span>speak replies</span>
    </label>
    <div class="inbar" id="inbar">
      <button class="fs-glyph" id="sessions-open" type="button" aria-label="sessions">
        <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 1h14M1 6h14M1 11h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="field" id="composer" contenteditable="true" role="textbox"
           aria-label="Message your coach" data-ph="Message your coach"></div>
      <button class="send" id="send" type="button" aria-label="Send"><span>&#8593;</span></button>
    </div>
  </div>
  <aside class="pinned" id="chat-drawer" hidden></aside>
  </div>

  <div class="screen" id="menu-screen" hidden>
    <div class="ovbar">
      <button class="backbtn" id="menu-close" type="button" aria-label="back">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M13.5 4.5 7 11l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <span class="ovt">Timeline</span>
    </div>
    <div class="tabs" id="menu-tabs" role="tablist">
      <button class="tab on" id="tab-events" type="button" role="tab" aria-selected="true">Events</button>
      <button class="tab" id="tab-people" type="button" role="tab" aria-selected="false">People</button>
    </div>
    <div class="search" id="menu-searchrow">
      <input id="menu-search" type="text" placeholder="Search events" aria-label="Search events">
    </div>
    <div class="scroller" id="menu-body"></div>
    <div class="foot" id="menu-foot">
      <button class="addbtn" id="menu-add" type="button">+ Add event</button>
    </div>
  </div>

  <div class="screen" id="task-screen" hidden>
    <div class="fs-body" id="task-body"></div>
  </div>

  <div class="screen" id="ballot-screen" hidden>
    <div class="pic">
      <div class="pin-label"><span>Every event in this cut</span></div>
      <div class="view" id="ballot-view"></div>
      <div class="caption" id="ballot-caption"></div>
    </div>
    <div class="fs-body" id="ballot-body"></div>
  </div>

  <div class="screen" id="meeting-screen" hidden>
    <div class="stats" id="meeting-stats"></div>
    <div class="pic">
      <div class="pin-label"><span>Every event in this cut &middot; teal where the vote agreed, amber where it did not</span></div>
      <div class="view" id="meeting-view"></div>
    </div>
    <div class="fs-body" id="meeting-body"></div>
    <div class="ratbar" id="meeting-bar"></div>
  </div>

  <div class="screen" id="result-screen" hidden>
    <div class="stats" id="result-stats"></div>
    <div class="fs-body" id="result-body"></div>
  </div>

  <div class="screen" id="cut-screen" hidden>
    <div class="chat" id="cut-chat"></div>
    <div class="inbar ct-bar" id="cut-bar"></div>
  </div>

  <div class="screen" id="table-screen" hidden>
    <div class="fs-body" id="table-body"></div>
  </div>

  <div class="split" id="coding-screen" hidden>
    <div class="screen">
      <div class="pic">
        <div class="pin-label"><span id="coding-crumb">Family timeline</span></div>
        <div class="view" id="coding-view"></div>
        <div class="caption" id="coding-caption"></div>
      </div>
      <div class="chat" id="coding-chat"></div>
      <div class="inbar" id="coding-inbar">
        <div class="field" id="coding-composer" contenteditable="true" role="textbox"
             aria-label="Say what this line tells you happened"
             data-ph="tap a line, then say what happened"></div>
        <button class="send" id="coding-send" type="button" aria-label="Send"><span>&#8593;</span></button>
      </div>
    </div>
    <aside class="pinned">
      <div class="tabs" id="coding-tabs" role="tablist">
        <button class="tab on" id="coding-tab-events" type="button" role="tab" aria-selected="true">Events</button>
        <button class="tab" id="coding-tab-people" type="button" role="tab" aria-selected="false">People</button>
      </div>
      <div class="search">
        <input id="coding-search" type="text" placeholder="Search events" aria-label="Search events">
      </div>
      <div class="scroller" id="coding-rows"></div>
      <div class="foot">
        <button class="addbtn" id="coding-add" type="button">+ Add event</button>
      </div>
    </aside>
  </div>

  <div class="screen" id="rules-screen" hidden>
    <div class="ovbar">
      <button class="backbtn" id="rules-close" type="button" aria-label="back">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M13.5 4.5 7 11l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <span class="ovt">Coding guidelines</span>
    </div>
    <div class="scroller" id="rules-body"></div>
  </div>

  <div class="signedout" id="signedout" hidden>
    <div class="so-app">Family Diagram</div>
    <div class="so-who" id="signedout-who"></div>
    <button class="so-in" id="signedout-in" type="button">Sign in</button>
  </div>

  <div class="overlay" id="overlay"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
