# The chat app's own box (T-11, R-0330): one image, its own Postgres, Redis for
# the agent queue, and Caddy in front for TLS. Nothing here is shared with the
# Pro box. Secrets live in secrets.env, encrypted with sops; decrypt it on the
# box into /etc/fd/secrets.env (root-only) and nowhere else.

# A service's own `environment` replaces an anchored one wholesale, so the
# shared settings are their own anchor and each service merges them in.
x-app-env: &app-env
  FLASK_CONFIG: production
  FLASK_APP: "btcopilot.app:create_app()"
  FLASK_SQLALCHEMY_DATABASE_URI: postgresql://chat:${POSTGRES_PASSWORD}@fd-postgres:5432/chat
  CELERY_BROKER_URL: redis://fd-redis:6379/0
  CELERY_RESULT_BACKEND: redis://fd-redis:6379/0
  BTCOPILOT_INSTANCE_PATH: /app/instance
  SOPS_AGE_KEY_FILE: /run/secrets/age.key
  DD_ENV: production
  DD_SITE: datadoghq.com
  DD_LOGS_INJECTION: "true"

x-app: &app
  image: ghcr.io/patrickkidd/btcopilot:${BTCOPILOT_TAG:-latest}
  restart: unless-stopped
  env_file: /etc/fd/secrets.env
  volumes:
    - ./instance:/app/instance
    - /etc/fd/age.key:/run/secrets/age.key:ro
  depends_on:
    fd-postgres:
      condition: service_healthy
    fd-redis:
      condition: service_healthy

services:
  fd-caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./appcast:/srv/appcast:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fd-app

  fd-app:
    <<: *app
    container_name: fd-app
    environment:
      <<: *app-env
      DD_SERVICE: fd-app
    expose:
      - "8888"

  fd-worker:
    <<: *app
    container_name: fd-worker
    environment:
      <<: *app-env
      FD_IS_CELERY: "1"
      DD_SERVICE: fd-worker
    command: ["python", "-m", "celery", "-A", "btcopilot.celery:celery", "worker", "--pool=solo", "--loglevel=info"]
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A btcopilot.celery:celery inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3

  fd-postgres:
    image: postgres:16-alpine
    container_name: fd-postgres
    restart: unless-stopped
    volumes:
      - ./instance/postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 10s
      timeout: 5s
      retries: 5

  fd-redis:
    image: redis:7-alpine
    container_name: fd-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fd-datadog:
    image: gcr.io/datadoghq/agent:7
    container_name: fd-datadog
    profiles: ["datadog"]
    restart: unless-stopped
    env_file: /etc/fd/secrets.env
    environment:
      DD_SITE: datadoghq.com
      DD_ENV: production
      DD_HOSTNAME: familydiagram-app
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:fd-datadog"
      DD_APM_ENABLED: "false"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

volumes:
  caddy-data:
  caddy-config:
