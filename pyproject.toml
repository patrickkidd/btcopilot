[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btcopilot"
version = "1.0.0"
description = "BT Copilot"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name="Patrick Stinson", email="patrick@alaskafamilysystems.com" }
]


[project.optional-dependencies]
app = [
    "bcrypt",
    "celery==5.5.3",
    "redis",
    "click",
    "colorlog",
    "gunicorn",
    "flask",
    "webauthn",
    "cbor2<6",  # newer cbor2 needs a C build on macOS x86_64
    "flask-bcrypt",
    "flask-mail",
    "flask-sqlalchemy",
    "flask-wtf",
    "openai",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "psycopg2-binary",
    "regex",
    "pygments",
    "python-dateutil",
    "pyyaml",
    "stripe",
    "alembic",
    "rich",
    # schema.py, diagramjson.py, pdp.py and proimport.py read the Pro app's pickles
    "sip==6.8.6",
    "pyqt5==5.15.11",
    "pyqt5-sip==12.15.0",
    "pyqt5-qt5==5.15.2",
    "anthropic>=0.97,<1",
    "google-genai",
    "nest_asyncio",
    "rapidfuzz>=3.0.0",
]

test = [
    "black",
    "build",
    "freezegun",
    "mock",
    "playwright",
    "pytest",
    "pytest-asyncio",
    "pytest-playwright",
    "requests",
    "snapshottest",
]


[project.urls]
repository = "https://github.com/patrickkidd/btcopilot"

[tool.setuptools]
packages = {find = {exclude = ["build*", "dist*"]}}
package-dir = {"" = "."}

[tool.setuptools.package-data]
"btcopilot.personal" = ["static/**/*", "prompty/**/*"]
"btcopilot.auth" = ["templates/**/*"]
