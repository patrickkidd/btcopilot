; The chat app's own settings (R-0332). None of the training app's screen
; markers, and none of Pro's.
[pytest]
addopts = --asyncio-mode=auto -p no:ddtrace -p no:ddtrace.pytest_bdd -p no:ddtrace.pytest_benchmark
asyncio_default_fixture_loop_scope = function

markers =
    chat_flow: mock various parts of the intelligence flow
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: reaches a real model, and costs money; needs --e2e
    live: one real coach turn on the private prompts (personal/live); needs --e2e and the prompts' key, never on CI (R-0451)
    real_passwords: use real bcrypt hashing instead of the fast stand-in
