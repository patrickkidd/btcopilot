[pytest]
junit_family=legacy

addopts = --asyncio-mode=auto -p no:ddtrace -p no:ddtrace.pytest_bdd -p no:ddtrace.pytest_benchmark

# Was getting a warning about it, no idea what it does
asyncio_default_fixture_loop_scope=function

markers =
    e2e: End-to-end tests that call real external services (LLM, etc)
    conventions: the oracle guards; need a sops key, so they run on CI only (local runs pass -m "not conventions")
