{% extends "base.html" %}

{% block head %}
<style>
.theory-page table {
    display: block;
    overflow-x: auto;
}
.theory-page {
    overflow-wrap: anywhere;
}
</style>
{% endblock %}

{% block content %}
<div class="content theory-page" id="theory-page"></div>
<script>
marked.use({
    renderer: {
        heading(text, level, raw) {
            const id = raw.toLowerCase().replace(/[^\w\- ]/g, '').replace(/ /g, '-');
            return `<h${level} id="${id}">${text}</h${level}>`;
        }
    }
});
document.getElementById('theory-page').innerHTML = marked.parse({{ text|tojson }});
if (location.hash) {
    document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
}
</script>
{% endblock %}
