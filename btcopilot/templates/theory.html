<!doctype html>
<html lang="en">
  <head>
    {% include "head.html" %}
    <title>{{ title }}</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 15px/1.55 var(--sans);
        padding: 16px;
      }
      main { max-width: 760px; margin: 0 auto; overflow-wrap: anywhere; }
      nav { font: 500 13px var(--mono); margin-bottom: 12px; }
      a { color: var(--data); }
      h1 { font: 800 21px/1.3 var(--sans); }
      h2 { font: 600 18px/1.35 var(--sans); margin-top: 28px; }
      h3 { font: 600 16px/1.4 var(--sans); }
      code { font: 400 13px var(--mono); }
      blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--faint); }
      /* a table wider than the phone scrolls inside itself, never the page */
      table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 14px; }
      th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; min-width: 90px; }
      th { background: var(--panel); }
      .error { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="{{ url_for('app.theory_index') }}">{{ guide }}</a></nav>
      {% if error %}
        <h1>{{ title }}</h1>
        <p class="error">{{ error }}</p>
      {% else %}
        {{ body }}
      {% endif %}
    </main>
  </body>
</html>
