# Build the image on a push to master, tag it with the release version (R-0419),
# and deploy it to the box. The host is a repository variable so no address is
# committed before the droplet exists.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web bundle
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # 3.YYYY.M.D.N+g<sha7>: the commit's UTC date, N = 1 + the release tags
      # already carrying that date. The committed version stays 3.0.0.
      - name: Version
        id: version
        run: |
          day=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%-m.%-d HEAD)
          n=$(( $(git tag -l "3.${day}.*" | wc -l) + 1 ))
          version="3.${day}.${n}+g$(git rev-parse --short=7 HEAD)"
          pip install build packaging
          python -c "from packaging.version import Version; Version('${version}')"
          sed -i "s/^version = \"3.0.0\"$/version = \"${version}\"/" pyproject.toml
          grep -q "^version = \"${version}\"$" pyproject.toml
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${version/+/-}" >> "$GITHUB_OUTPUT"

      - name: Build the wheel
        run: python -m build --wheel

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            WHEEL_FILE=dist/*.whl

      - name: Tag the release
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'workflow_dispatch' && vars.FD_HOST != ''
    environment: production
    steps:
      - name: Pull the image and run the chain
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ vars.FD_HOST }}
          port: 22
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            export BTCOPILOT_TAG=${{ needs.build.outputs.tag }}
            cd /var/www/btcopilot
            git fetch origin ${{ github.sha }}
            git checkout --detach ${{ github.sha }}
            # one time: the box's files move from deploy/chat to deploy; the database lives in instance/
            if [ -d deploy/chat ]; then
              [ -d deploy/chat/instance ] && mv deploy/chat/instance deploy/instance
              rmdir deploy/chat
            fi
            cd deploy
            docker compose --env-file /etc/fd/secrets.env pull
            # the new app and worker start beside the old ones; the old stop once the new are healthy
            docker rollout --env-file /etc/fd/secrets.env fd-app
            docker rollout --env-file /etc/fd/secrets.env fd-worker
            docker compose --env-file /etc/fd/secrets.env up -d --remove-orphans
            # one time (R-0417): a database on the retired chain is stamped to the single revision
            psql() { docker compose --env-file /etc/fd/secrets.env exec -T fd-postgres psql -U familydiagram -d familydiagram -tAc "$1"; }
            at=$(psql "SELECT CASE WHEN to_regclass('alembic_version') IS NULL THEN '' ELSE (SELECT string_agg(version_num, ',') FROM alembic_version) END")
            # the retired chain kept the extraction pipeline's columns and statuses (R-0414); the single revision has none
            unpipe="ALTER TABLE discussions DROP COLUMN extracting, DROP COLUMN extracted_through_order, DROP COLUMN pending_extracted_through_order; ALTER TABLE statements DROP COLUMN pdp_deltas; ALTER TYPE discussionstatus RENAME TO discussionstatus_retired; CREATE TYPE discussionstatus AS ENUM ('pending', 'generating', 'failed', 'ready'); ALTER TABLE discussions ALTER COLUMN status DROP DEFAULT, ALTER COLUMN status TYPE discussionstatus USING status::text::discussionstatus, ALTER COLUMN status SET DEFAULT 'pending'; DROP TYPE discussionstatus_retired"
            case "$at" in
              ""|1b00000000aa) ;;
              1a00000000ae) psql "ALTER TABLE model_calls ADD COLUMN fallback JSONB; $unpipe; UPDATE alembic_version SET version_num = '1b00000000aa'" ;;
              1a00000000af) psql "$unpipe; UPDATE alembic_version SET version_num = '1b00000000aa'" ;;
              *) echo "database is at retired revision $at; stamp it by hand before deploying" >&2; exit 1 ;;
            esac
            docker compose --env-file /etc/fd/secrets.env exec -T fd-app flask admin db upgrade
            docker compose --env-file /etc/fd/secrets.env ps
