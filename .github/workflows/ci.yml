name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[app,test]

      - name: Verify test package import
        run: python -c "import btcopilot.tests; print(btcopilot.tests)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build companion web bundle
        run: npm --prefix web run build

      - name: Run web unit tests
        run: npm --prefix web test

      - name: Run unit tests
        run: pytest -svv --disable-warnings --pyargs btcopilot.tests

  web-visual:
    runs-on: ubuntu-24.04
    env:
      FLASK_APP: btcopilot.app:create_app
      FLASK_CONFIG: development
      FLASK_SQLALCHEMY_DATABASE_URI: sqlite:////tmp/companion-visual.db
      COMPANION_URL: http://127.0.0.1:8889
      FIXTURE_CWD: ${{ github.workspace }}
      FIXTURE_CMD: python -m flask companion fixtures
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[app,test]

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Install Playwright chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Build companion web bundle
        run: npm --prefix web run build

      - name: Create sandbox database
        run: |
          python -c "
          from btcopilot.app import create_app
          from btcopilot.extensions import db
          app = create_app()
          with app.app_context():
              db.create_all()
          "

      - name: Start Flask sandbox
        run: |
          nohup python -m flask run -p 8889 --no-reload > /tmp/flask-sandbox.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$COMPANION_URL/" > /dev/null && exit 0
            sleep 1
          done
          echo "sandbox did not come up in time" >&2
          cat /tmp/flask-sandbox.log
          exit 1

      - name: Run visual tests
        run: npm --prefix web run test:visual -- --project=phone

      - name: Show sandbox log on failure
        if: failure()
        run: cat /tmp/flask-sandbox.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
